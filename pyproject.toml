[project]
name = "portpilot"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml==0.7.1",
    "faker==40.54.0",
    "fastapi==0.162.2",
    "filelock==4.2.9",
    "geopandas==1.2.0",
    "global-land-mask==1.0.0",
    "httpx==0.28.1",
    "ipykernel==7.4.0",
    "langchain==1.4.4",
    "langchain-core==1.6.9",
    "langchain-google-genai==4.4.0",
    "langchain-groq==1.1.3",
    "langchain-openai==1.7.0",
    "langgraph==1.2.20",
    "langgraph-checkpoint-postgres==3.2.0",
    "langsmith==0.14.17",
    "matplotlib==3.11.2",
    "nbconvert==7.17.2",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
    "pillow==13.0.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.8",
    "pyarrow>=25.0.1",
    "pydantic==2.14.3",
    "pymongo==4.20.0",
    "pymupdf==1.28.2",
    "python-multipart==0.0.33",
    "python-pptx==1.0.2",
    "qdrant-client==1.20.0",
    "rapidocr==3.10.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "searoute==1.6.0",
    "sentry-sdk==2.75.0",
    "tokenizers==0.23.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pyright==1.1.414",
    "ruff==0.17.4",
]

# Engineering hygiene H1: bug-finding rules only; the ignored codes are this project's script idioms (sys.path insert
# before imports, short `;` statements, `l` / lambda names, zip without strict). Gate = dev/tools/lint_ratchet.py.
[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["dev/history", "dev/_scratch", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E402", "E701", "E702", "E731", "E741", "B007", "B905"]

[tool.pyright]
include = ["pipelines/agents", "pipelines/lib", "pipelines/api"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
