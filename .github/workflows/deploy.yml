# Deploy a green commit to staging or production (Staging readiness plan P10, ADR-071). Manual only.
# Owner setup (docs/deploy/RUNBOOK.md §GitHub): environments `staging`, `production` and `<env>-migrations`, each
# with the owner as required reviewer; repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# (an app registration with a federated credential for this repository's environments — no client secret) and, per
# environment, AZURE_RESOURCE_GROUP + AZURE_VM_NAME. The VM runs ops/deploy/deploy.sh; nothing is pushed to a registry.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      ref:
        description: "A tag or commit SHA whose CI run is green"
        required: true
      apply_migrations:
        description: "Apply pending db/migrations (a second approval)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    permissions:
      contents: read
      actions: read
    env:
      REF: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The ref is well formed
        run: '[[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "bad ref"; exit 1; }'
      - name: Verify the latest push CI run for the release commit
        id: ci
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit SHA for $REF"; exit 1; }
          ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$sha&per_page=1" \
            --jq '.workflow_runs[] | [.head_sha, .status, (.conclusion // "pending")] | join(" ")')
          echo "CI for $REF ($sha): ${ci:-no push run found}"
          [[ "$ci" == "$sha completed success" ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  migrations-approval:
    if: ${{ inputs.apply_migrations }}
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-migrations
    steps:
      - run: echo "the owner approved applying pending migrations to ${{ inputs.environment }}"

  deploy:
    needs: [gate, migrations-approval]
    if: ${{ always() && needs.gate.result == 'success' && (needs.migrations-approval.result == 'success' || needs.migrations-approval.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      TARGET: ${{ inputs.environment }}
      FLAG: ${{ inputs.apply_migrations && '--apply-migrations' || '' }}
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run deploy.sh on the VM
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad release SHA"; exit 1; }
          out=$(az vm run-command invoke --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.AZURE_VM_NAME }}" --command-id RunShellScript \
                --scripts "sudo -u portpilot bash /opt/portpilot/repo/ops/deploy/deploy.sh $TARGET $RELEASE_SHA $FLAG; echo DEPLOY_EXIT=\$?" \
                --query "value[0].message" --output tsv)
          echo "$out"
          echo "$out" | grep -q "DEPLOY_EXIT=0"
