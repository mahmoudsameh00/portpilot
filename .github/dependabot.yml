# Engineering hygiene H2: weekly update PRs (the owner reviews each; pins stay `==`, ADR on any model / SDK change).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Frontend plan §11.1: the web app's npm packages (exact pins; 0.x packages such as assistant-ui reviewed one by one).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # frontend-dev-loop: a package version is at least two weeks old before we take it
    cooldown:
      default-days: 14
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["@assistant-ui/*"]
